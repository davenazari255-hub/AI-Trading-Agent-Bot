name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, types, tests, migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mooo
          POSTGRES_PASSWORD: mooo
          POSTGRES_DB: mooo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mooo -d mooo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://mooo:mooo@localhost:5432/mooo
      REDIS_URL: redis://localhost:6379/0
      BYBIT_ENV: demo
      ALLOW_LIVE_TRADING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate a throwaway master key (CI only)
        run: echo "MOOO_MASTER_KEY=$(python -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest -q
      - name: Alembic upgrade
        run: alembic upgrade head

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env with generated local secrets
        run: python3 scripts/init_env.py
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for API, worker heartbeat, and web
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsk https://localhost/api/v1/health -o health.json; then
              cat health.json; echo
              if python3 -c 'import json, sys; d = json.load(open("health.json")); ok = d["worker"]["status"] == "up" and d["trading_environment"] == "demo" and d["live_trading_allowed"] is False; sys.exit(0 if ok else 1)'; then
                if curl -fsk https://localhost/ | grep -q "DEMO TRADING"; then
                  echo "Stack is healthy"
                  exit 0
                fi
              fi
            fi
            sleep 3
          done
          echo "Stack did not become healthy"
          exit 1
      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down -v
